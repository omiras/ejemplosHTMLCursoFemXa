<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tienda Tech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .product {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            max-width: 350px;
            margin: auto;
            text-align: center;
        }

        .product img {
            width: 100%;
            max-width: 300px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .description {
            color: #555;
        }

        .button {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 10px;
            border-radius: 5px;
        }

        .expensive {
            color: red;
            border: 2px solid black;
        }

        .cheap {
            color: green;
            border: 5px solid blue;
        }

    </style>
</head>

<body>

    <header>
        <h1 id="page-title">Tienda Tech</h1>
        <p id="welcome-message">Los mejores productos tecnológicos</p>
    </header>

    <main>

        <div class="product">

            <img
                id="product-image"
                src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
                alt="Ordenador portátil"
                width="300"
            >

            <h2 id="product-name">Ordenador portátil</h2>

            <p id="product-price" class="price">899 €</p>

            <p id="product-description" class="description">
                Ordenador portátil ligero y potente para trabajar y estudiar.
            </p>

            <p id="product-category">
                Categoría: Informática
            </p>

            <button class="button">
                Añadir al carrito
            </button>

        </div>

    </main>

    <script>

        // Prueba aquí tus instrucciones JavaScript




        const productOferta = {
            name: "Auriculares inalámbricos",
            price: 129,
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
            description: "Auriculares inalámbricos con cancelación de ruido.",
            category: "Audio"
        };

    const productName = document.querySelector("#product-name");
    console.log(productName.textContent);

    const productPrice = document.querySelector("#product-price");
    console.log(productPrice.textContent);

    // método getElementById
    const productCategory = document.getElementById("product-category"); // sin el # !!!
    console.log(productCategory.textContent);

    // Modificar el precio del producto 
    document.querySelector("#product-price").textContent = "650 €";

    // Aplicar la clase .expansive al nodo donde está el precio
    document.querySelector("#product-price").classList.add("cheap");

    </script>

</body>

</html>
