<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triplex - ONCE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        #app {
            width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        #titulo {
            margin-bottom: 30px;
        }

        #bolas {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .bola {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ddd;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;
            font-weight: bold;
        }

        #generar {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main id="app">

        <h1 id="titulo">🎱 Triplex</h1>

        <div id="bolas">

            <div id="bola1" class="bola">
                
            </div>

            <div id="bola2" class="bola">
                
            </div>

            <div id="bola3" class="bola">
                
            </div>

        </div>

        <button id="generar">
            Generar combinación
        </button>

    </main>
    <script>
        const button = document.querySelector("#generar");
        button.addEventListener("click", generarCombinacion);

        function generarCombinacion() {
            console.log("Combinación generada.");

            // 2. Generar 1 número aleatorio y meter ese valor en la bola 1
            let numeroAleatorio = Math.floor(Math.random() * 10);

            const bola1 = document.querySelector("#bola1");
            bola1.textContent = numeroAleatorio;

            // bola 2
            numeroAleatorio = Math.floor(Math.random() * 10);

            const bola2 = document.querySelector("#bola2");
            bola2.textContent = numeroAleatorio;
            
            // bola 3
            numeroAleatorio = Math.floor(Math.random() * 10);

            const bola3 = document.querySelector("#bola3");
            bola3.textContent = numeroAleatorio;
            
        }
    </script>

</body>

</html>
