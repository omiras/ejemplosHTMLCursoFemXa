<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Coordenadas</title>

    <style>
        body {
            margin: 0;
        }

        #caja {
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
    </style>
</head>

<body>

    <main id="caja"></main>

    <script>

        const caja = document.querySelector("#caja");
        caja.addEventListener("click", mostrarClic);
         
        function mostrarClic(event) {
            console.log("X:", event.clientX);
            console.log("Y:", event.clientY);
        }

    </script>

</body>

</html>
