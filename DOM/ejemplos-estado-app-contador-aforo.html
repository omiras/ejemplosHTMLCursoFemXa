<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Control de Aforo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .aforo {
            font-size: 70px;
            font-weight: bold;
            margin: 20px 0;
        }

        #mensaje {
            height: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #entrar {
            background: #4caf50;
            color: white;
        }

        #salir {
            background: #607d8b;
            color: white;
        }

        button:disabled {
            background: #ccc !important;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <header>
        <h1>Control de Aforo</h1>
    </header>


    <main>

        <div class="card">

            <p>PERSONAS EN EL RECINTO</p>

            <div class="aforo">
                <span id="aforo-actual">0</span> / 5
            </div>

            <p id="mensaje"></p>


            <div class="botones">

                <button id="entrar">
                    + Entra persona
                </button>

                <button disabled id="salir">
                    − Sale persona
                </button>

            </div>

        </div>

    </main>


    <script>

        // ESTADO
        let personas = 0;

        const AFORO_MAXIMO = 5;

        const entraPersona = document.querySelector("#entrar");
        entraPersona.addEventListener("click", añadirPersona);

        const salePersona = document.querySelector('#salir');
        salePersona.addEventListener("click", salirPersona);

        const aforoActual = document.querySelector("#aforo-actual");

        function salirPersona() {
            personas = personas - 1;
            aforoActual.textContent = personas;

            actualizarEstadoBotones();

        }

        function añadirPersona() {
            // 1. Incrementar la variable 'personas'
            personas = personas + 1;

            // 2. Actualizar el nodo del DOM donde se ven las personas actuales en el recinto
            aforoActual.textContent = personas;

            actualizarEstadoBotones();

        }

        function actualizarEstadoBotones() {
            // Si el aforo esta a 0, debe deshabilitar el botón de "- sale persona"
            // Si el aforo está complete, debe deshabilitar el botón de "+ entra persona"
            // en cualquier otro caso, debe habilitar los botones

            if (personas == 0) {
                salePersona.disabled = true;
            } else {
                salePersona.disabled = false;
            }
            // ¿Como comprueba que he llegado a 5? Con el AFORO_MAXIMO
            // si el personas <= AFORO_MAXIMO , boton habilitado
            // en caso contrario, deshabilitar 
            if (personas < AFORO_MAXIMO) {
                entraPersona.disabled = false
            } else {
                entraPersona.disabled = true;
            }
        }



    </script>

</body>

</html>
