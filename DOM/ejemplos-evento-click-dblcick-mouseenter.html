<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cofre secreto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 50px;
        }

        #app {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        #cofre {
            font-size: 80px;
            cursor: pointer;
            margin: 30px;
        }

        #mensaje {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <main id="app">

        <h1 id="titulo">🔐 Cofre secreto</h1>

        <div id="cofre">
            🧰
        </div>

        <p id="mensaje">
            Haz clic sobre el cofre
        </p>

    </main>

    <script>

    const nodoCofre = document.querySelector("#cofre");

    function abrir() {
        console.log("¡Quieres abrir el cofre!");
        nodoCofre.textContent = "💰";
    }

    // Asignar evento en una propiedad del nodo
    // nodoCofre.onclick = abrir; // "Cuando me hagas clic en el cofre, ejecútame la función que se llama 'abrir'"
    nodoCofre.addEventListener("click", abrir);
     

    </script>

</body>

</html>
