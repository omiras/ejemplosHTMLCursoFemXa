<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modal con Escape</title>

    <style>

        body {
            font-family: Arial;
            margin: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.6);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ventana {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 350px;
        }

        .ventana h1 {
            margin-top: 0;
        }

        .ventana p {
            color: #555;
        }

        .oculto {
            display: none;
        }

    </style>
</head>

<body>


    <div id="modal" class="modal">

        <div class="ventana">

            <h1>👋 ¡Hola!</h1>

            <p>
                Esta ventana solo se puede cerrar
                pulsando la tecla ESC.
            </p>

            <p>
                <strong>Pulsa ESC</strong>
            </p>

        </div>

    </div>


    <script>

        const modal = document.querySelector("#modal");

        // Añadimos a TODO un listener para que detecte cuando el usuario pulsa una tecla
        document.addEventListener("keydown", function(event) {

            console.log(event.key);

            // Si el usuario ha pulsado la tecla "Escape", entoces, asociamos la clase .oculto al modal

            if (event.key === "Escape") {
                // Añade la clase oculto al modal
                modal.classList.add("oculto");
            }
        });

    </script>

</body>
</html>
